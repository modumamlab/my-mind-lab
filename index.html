  <!-- STEP5.1: Vite가 JSX를 CommonJS require 형태로 변환하는 환경 대응 -->
  <script>
    (function () {
      if (typeof window.require === "function") return;

      function jsx(type, props, key) {
        var nextProps = props ? Object.assign({}, props) : {};
        if (key !== undefined && key !== null) nextProps.key = key;
        return window.React.createElement(type, nextProps);
      }

      window.require = function (moduleName) {
        if (moduleName === "react") return window.React;
        if (moduleName === "react-dom") return window.ReactDOM;
        if (moduleName === "react-dom/client") {
          return { createRoot: window.ReactDOM.createRoot };
        }
        if (
          moduleName === "react/jsx-runtime" ||
          moduleName === "react/jsx-dev-runtime"
        ) {
          return {
            jsx: jsx,
            jsxs: jsx,
            jsxDEV: jsx,
            Fragment: window.React.Fragment
          };
        }
        throw new Error("지원하지 않는 브라우저 require 모듈: " + moduleName);
      };
    })();
  </script>

  <!-- Vite/Netlify Dev가 app.jsx를 직접 변환합니다. 외부 Babel CDN 의존성을 제거했습니다. -->
